name: Rust port checks

on:
  push:
    branches: [rust/stop-token-detector-v0.18.0]
    paths: [rust-port/**, .github/workflows/rust-port.yml]
  pull_request:
    paths: [rust-port/**, .github/workflows/rust-port.yml]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.70.0 --profile minimal --component rustfmt --component clippy
      - name: Unit tests (offline, locked)
        run: cargo +1.70.0 test --manifest-path rust-port/Cargo.toml --locked --offline
      - name: Formatting
        run: cargo +1.70.0 fmt --manifest-path rust-port/Cargo.toml -- --check
      - name: Clippy
        run: cargo +1.70.0 clippy --manifest-path rust-port/Cargo.toml --all-targets --locked --offline -- -D warnings
