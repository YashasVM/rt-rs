name: Rust port real sampler integration

on:
  push:
    branches: [rust/stop-token-detector-v0.18.0]
    paths:
      - .github/workflows/rust-sampler-baseline.yml
      - runtime/components/top_p_cpu_sampler*
      - runtime/components/BUILD
      - rust-port/BUILD
      - rust-port/src/**
      - rust-port/ffi/**
      - rust-port/native/greedy_rust.*
      - rust-port/native/stop_ffi.h

permissions:
  contents: read

concurrency:
  group: rust-sampler-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sampler:
    name: Real sampler (Rust FP16=${{ matrix.rust_fp16 }})
    strategy:
      fail-fast: false
      matrix:
        rust_fp16: ['false', 'true']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Verify existing hosted tools and resource budget
        run: |
          set -euo pipefail
          export BAZELISK_HOME="$RUNNER_TEMP/rt-rs-bazelisk"
          test "$(cat .bazelversion)" = 7.6.1
          command -v bazelisk
          command -v clang
          command -v clang++
          bazelisk --version
          clang --version
          java -version
          python3 --version
          df -h
          free -h
      - name: Test real TensorBuffer sampler and native-reference parity
        run: |
          set -euo pipefail
          export BAZELISK_HOME="$RUNNER_TEMP/rt-rs-bazelisk"
          # No model, credentials, remote cache, paid runner or runtime stubs.
          # Keep upstream WORKSPACE pins and supported CPU-only configuration.
          bazelisk --output_user_root="$RUNNER_TEMP/rt-rs-bazel" test \
            --config=linux_x86_64 \
            --@litert//litert/build_common:build_include=cpu_only \
            --define=rt_rs_fp16_greedy=${{ matrix.rust_fp16 }} \
            --jobs=2 \
            --local_ram_resources=6144 \
            --test_output=errors \
            --verbose_failures \
            //runtime/components:top_p_cpu_sampler_test
      - name: Verify selected binary linkage
        run: |
          set -euo pipefail
          nm bazel-bin/runtime/components/top_p_cpu_sampler_test > "$RUNNER_TEMP/sampler-symbols.txt"
          if test '${{ matrix.rust_fp16 }}' = true; then
            grep -E ' [Tt] rt_rs_greedy_fp16_token_ids$' "$RUNNER_TEMP/sampler-symbols.txt"
          else
            if grep -F 'rt_rs_greedy_fp16_token_ids' "$RUNNER_TEMP/sampler-symbols.txt"; then
              echo 'Unexpected Rust FP16 backend in native-default binary' >&2
              exit 1
            fi
          fi
      - name: Report final resource use and available test log
        if: always()
        run: |
          df -h
          free -h
          if test -d "$RUNNER_TEMP/rt-rs-bazel"; then
            du -sh "$RUNNER_TEMP/rt-rs-bazel"
            find "$RUNNER_TEMP/rt-rs-bazel" -type f \
              -path '*/testlogs/runtime/components/top_p_cpu_sampler_test/test.log' \
              -exec tail -200 {} \;
          fi
